<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Spine Char002 — Swordsman Demo ⚔️</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: linear-gradient(180deg, #1a2a3a, #2d1f3d, #1a1a2e);
      color: #f1faee; font-family: system-ui, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 1rem; padding: 1rem;
    }
    h1 { font-size: 1.5rem; text-align: center; }
    canvas {
      border: 2px solid rgba(255,255,255,0.1); border-radius: 12px;
      max-width: 100%;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 600px;
    }
    .btn {
      padding: 0.5rem 1rem; border: 1px solid rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.08); color: #f1faee;
      border-radius: 8px; cursor: pointer; font-family: inherit;
      font-size: 0.85rem; transition: all 0.15s;
    }
    .btn:hover { background: rgba(155,93,229,0.3); border-color: #9b5de5; }
    .btn.active { background: #9b5de5; border-color: #9b5de5; color: white; }
    .status { font-size: 0.85rem; color: #8899aa; text-align: center; }
  </style>
</head>
<body>
  <h1>⚔️ Char002 — Swordsman (Spine 3.8 Binary)</h1>
  <canvas id="canvas" width="500" height="600"></canvas>
  <div class="controls" id="controls"></div>
  <div class="status" id="status">Loading...</div>

  <script src="spine-webgl-38.js"></script>
  <script>
    const ATLAS_URL = "assets/char002/H30056.atlas";
    const SKEL_URL = "assets/char002/H30056.skel";
    const PNG_URL = "assets/char002/H30056.png";

    const statusEl = document.getElementById("status");
    const controlsEl = document.getElementById("controls");

    let gl, shader, batcher, skeletonRenderer;
    let skeleton, animState, animStateData;
    let lastTime = 0;
    let mvp = new spine.webgl.Matrix4();
    let camX = 0, camY = 0, camScale = 1;

    function init() {
      const canvas = document.getElementById("canvas");
      const config = { alpha: true, premultipliedAlpha: true };
      gl = canvas.getContext("webgl", config) || canvas.getContext("experimental-webgl", config);
      if (!gl) {
        statusEl.textContent = "WebGL not supported!";
        return;
      }
      shader = spine.webgl.Shader.newTwoColoredTextured(gl);
      batcher = new spine.webgl.PolygonBatcher(gl);
      skeletonRenderer = new spine.webgl.SkeletonRenderer(gl);
      skeletonRenderer.premultipliedAlpha = false; // atlas has no pma

      loadAssets();
    }

    function loadAssets() {
      statusEl.textContent = "Loading assets...";

      // Load atlas text
      fetch(ATLAS_URL)
        .then(r => r.text())
        .then(atlasText => {
          // Load texture image
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function() {
            // Create WebGL texture
            const glTexture = new spine.webgl.GLTexture(gl, img);

            // Parse atlas
            const atlas = new spine.TextureAtlas(atlasText, function(path) {
              return glTexture;
            });

            // Load binary skeleton
            fetch(SKEL_URL)
              .then(r => r.arrayBuffer())
              .then(skelData => {
                setupSkeleton(atlas, skelData);
              });
          };
          img.onerror = function() {
            statusEl.textContent = "Error loading texture";
          };
          img.src = PNG_URL;
        });
    }

    function setupSkeleton(atlas, skelArrayBuffer) {
      try {
        const atlasLoader = new spine.AtlasAttachmentLoader(atlas);
        const skeletonBinary = new spine.SkeletonBinary(atlasLoader);
        skeletonBinary.scale = 0.3;

        const skeletonData = skeletonBinary.readSkeletonData(new Uint8Array(skelArrayBuffer));

        skeleton = new spine.Skeleton(skeletonData);
        skeleton.setSkinByName("default");
        skeleton.setSlotsToSetupPose();

        animStateData = new spine.AnimationStateData(skeletonData);
        animStateData.defaultMix = 0.3;
        animState = new spine.AnimationState(animStateData);

        // Find first animation
        const firstAnim = skeletonData.animations[0];
        if (firstAnim) {
          animState.setAnimation(0, firstAnim.name, true);
        }

        // Calculate initial bounds
        skeleton.setToSetupPose();
        skeleton.updateWorldTransform();
        const offset = new spine.Vector2();
        const size = new spine.Vector2();
        skeleton.getBounds(offset, size, []);
        camX = offset.x + size.x / 2;
        camY = offset.y + size.y / 2;
        camScale = Math.max(size.x / 500, size.y / 600) * 1.3;

        // Build UI controls
        buildControls(skeletonData.animations);

        statusEl.textContent = `Playing: ${firstAnim ? firstAnim.name : 'none'} | Animations: ${skeletonData.animations.length}`;
        lastTime = Date.now() / 1000;
        requestAnimationFrame(render);
      } catch (e) {
        statusEl.textContent = "Error: " + e.message;
        console.error(e);
      }
    }

    function buildControls(animations) {
      controlsEl.innerHTML = "";
      animations.forEach((anim, i) => {
        const btn = document.createElement("button");
        btn.className = "btn" + (i === 0 ? " active" : "");
        btn.textContent = anim.name;
        btn.addEventListener("click", () => {
          const name = anim.name;
          const isLoop = name.toLowerCase().includes("idle") ||
                         name.toLowerCase().includes("walk") ||
                         name.toLowerCase().includes("loop") ||
                         name.toLowerCase().includes("run");
          animState.setAnimation(0, name, isLoop);
          statusEl.textContent = `Playing: ${name} (${isLoop ? "loop" : "once"})`;
          if (!isLoop) {
            const idleAnim = animations.find(a => a.name.toLowerCase().includes("idle"));
            if (idleAnim) animState.addAnimation(0, idleAnim.name, true, 0);
          }
          document.querySelectorAll(".btn").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
        });
        controlsEl.appendChild(btn);
      });
    }

    function render() {
      const now = Date.now() / 1000;
      const delta = now - lastTime;
      lastTime = now;

      const canvas = document.getElementById("canvas");

      // Update animation
      animState.update(delta);
      animState.apply(skeleton);
      skeleton.updateWorldTransform();

      // Dynamic camera - follow skeleton bounds
      const offset = new spine.Vector2();
      const size = new spine.Vector2();
      skeleton.getBounds(offset, size, []);

      const targetX = offset.x + size.x / 2;
      const targetY = offset.y + size.y / 2;
      const targetScale = Math.max(size.x / canvas.width, size.y / canvas.height) * 1.3;

      const lerp = Math.min(1, delta * 5);
      camX += (targetX - camX) * lerp;
      camY += (targetY - camY) * lerp;
      camScale += (targetScale - camScale) * lerp;

      // Clear
      gl.viewport(0, 0, canvas.width, canvas.height);
      gl.clearColor(0.1, 0.12, 0.18, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);

      // MVP
      mvp.ortho2d(
        camX - canvas.width / 2 * camScale,
        camY - canvas.height / 2 * camScale,
        canvas.width * camScale,
        canvas.height * camScale
      );

      // Render
      gl.enable(gl.BLEND);
      gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);

      shader.bind();
      shader.setUniformi(spine.webgl.Shader.SAMPLER, 0);
      shader.setUniform4x4f(spine.webgl.Shader.MVP_MATRIX, mvp.values);

      batcher.begin(shader);
      skeletonRenderer.premultipliedAlpha = false;
      skeletonRenderer.draw(batcher, skeleton);
      batcher.end();

      shader.unbind();

      requestAnimationFrame(render);
    }

    // Start
    init();
  </script>
</body>
</html>
