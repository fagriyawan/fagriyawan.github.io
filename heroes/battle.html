<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Battle - Heroes</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#0f0f1a; color:#eee; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100vh; }
        #hud { display:flex; justify-content:space-between; align-items:center; padding:8px 16px; background:linear-gradient(90deg,#1a1a2e,#16213e); border-bottom:2px solid #e94560; }
        #hud h2 { font-size:1rem; color:#e94560; }
        #hud .info { font-size:0.8rem; color:#aaa; }
        .speed-btn { padding:4px 10px; margin-left:6px; background:#0f3460; color:#eee; border:1px solid #e94560; border-radius:4px; cursor:pointer; font-size:0.75rem; }
        .speed-btn.active { background:#e94560; color:#fff; }
        #canvas-wrap { width:100%; height:calc(100vh - 42px); position:relative; }
        #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.85); z-index:10; flex-direction:column; gap:16px; }
        #overlay h1 { font-size:2rem; color:#e94560; }
        #overlay p { color:#aaa; font-size:0.9rem; text-align:center; max-width:400px; }
        #overlay button { padding:12px 32px; background:#e94560; color:#fff; border:none; border-radius:8px; font-size:1.1rem; cursor:pointer; font-weight:bold; }
        #overlay button:hover { background:#ff6b8a; }
        #overlay.hidden { display:none; }
        #log { position:absolute; top:8px; right:8px; width:200px; max-height:250px; overflow-y:auto; background:rgba(15,15,30,0.85); border:1px solid #333; border-radius:6px; padding:6px; font-size:0.6rem; z-index:5; pointer-events:none; }
        #log div { margin-bottom:2px; }
        .ldmg { color:#ff6b6b; }
        .lkill { color:#ffd700; }
        .lstage { color:#4ecdc4; font-weight:bold; }
    </style>
</head>
<body>
<div id="hud">
    <h2 id="stageTitle">Stage 1 / 5</h2>
    <div class="info" id="hudInfo">Preparing...</div>
    <div>
        <button class="speed-btn active" data-speed="1">1x</button>
        <button class="speed-btn" data-speed="2">2x</button>
        <button class="speed-btn" data-speed="3">3x</button>
    </div>
</div>
<div id="canvas-wrap">
    <div id="log"></div>
</div>
<div id="overlay">
    <h1 id="ovTitle">⚔️ Auto Battle</h1>
    <p id="ovText">Loading characters...</p>
    <button id="ovBtn" style="display:none">START</button>
</div>

<script src="pixi.min.js"></script>
<script src="pixi-spine.js"></script>
<script src="spine36-skel2json.js"></script>
<script>
(function(){
'use strict';

// ============ CHARACTER DEFINITIONS ============
const CHARS = [
    { id:'char001', name:'Cream Arcade', dataFile:'assets/char001/cream_arcade_000.json', atlasFile:'assets/char001/cream_arcade_000.atlas', format:'json36' },
    { id:'char002', name:'H30056', dataFile:'assets/char002/H30056.skel', atlasFile:'assets/char002/H30056.atlas', format:'skel38' },
    { id:'char003', name:'L05001', dataFile:'assets/char003/L05001.skel', atlasFile:'assets/char003/L05001.atlas', format:'skel36' },
    { id:'char004', name:'H30103', dataFile:'assets/char004/H30103.skel', atlasFile:'assets/char004/H30103.atlas', format:'skel38' },
    { id:'char005', name:'Crew 110016', dataFile:'assets/char005/crew110016.skel', atlasFile:'assets/char005/crew110016.atlas', format:'skel36' },
    { id:'char006', name:'Crew 110026', dataFile:'assets/char006/crew110026.skel', atlasFile:'assets/char006/crew110026.atlas', format:'skel36' },
    { id:'char007', name:'Crew 130004', dataFile:'assets/char007/crew130004.skel', atlasFile:'assets/char007/crew130004.atlas', format:'skel36' }
];

const HERO_IDS = [0,1,2];
const ENEMY_POOL = [3,4,5,6];
const STAGES = [
    { enemyCount:1 },
    { enemyCount:2 },
    { enemyCount:3 },
    { enemyCount:4 },
    { enemyCount:7, boss:true }
];

// ============ GLOBALS ============
let app, gameSpeed = 1, currentStage = 0, battleRunning = false;
let units = [], spineCache = {};
const wrap = document.getElementById('canvas-wrap');
const ovEl = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovBtn = document.getElementById('ovBtn');
const logEl = document.getElementById('log');
const stageTitle = document.getElementById('stageTitle');
const hudInfo = document.getElementById('hudInfo');

// ============ INIT PIXI ============
function initPixi() {
    app = new PIXI.Application({
        width: wrap.clientWidth,
        height: wrap.clientHeight,
        backgroundColor: 0x0f0f1a,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    wrap.insertBefore(app.view, wrap.firstChild);
    window.addEventListener('resize', () => {
        app.renderer.resize(wrap.clientWidth, wrap.clientHeight);
    });
}

// ============ SPINE LOADING (exact same as character-select.html) ============
function parseAtlas(atlasText, ch) {
    return new Promise((resolve, reject) => {
        const basePath = ch.atlasFile.substring(0, ch.atlasFile.lastIndexOf('/') + 1);
        let timeout = setTimeout(() => reject(new Error('Atlas timeout: ' + ch.id)), 15000);

        new PIXI.spine.TextureAtlas(atlasText, (pageName, callback) => {
            const imgUrl = basePath + pageName;
            const tex = PIXI.BaseTexture.from(imgUrl, { scaleMode: PIXI.SCALE_MODES.LINEAR });
            if (tex.valid) {
                callback(tex);
            } else {
                tex.once('loaded', () => callback(tex));
                tex.once('error', () => reject(new Error('Texture failed: ' + pageName)));
            }
        }, (atlas) => {
            clearTimeout(timeout);
            resolve(atlas);
        });
    });
}

async function loadCharacter(ch) {
    if (spineCache[ch.id]) return spineCache[ch.id];

    const atlasResp = await fetch(ch.atlasFile);
    if (!atlasResp.ok) throw new Error('Atlas fetch failed: ' + ch.atlasFile);
    let atlasText = await atlasResp.text();
    atlasText = atlasText.split('\n').map(l => l.trimEnd()).join('\n');

    let jsonData;
    if (ch.format === 'json36') {
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('JSON fetch failed');
        jsonData = await resp.json();
    } else if (ch.format === 'skel36') {
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('Skel fetch failed');
        const buf = await resp.arrayBuffer();
        jsonData = spine36SkelToJson(buf);
    } else if (ch.format === 'skel38') {
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('Skel fetch failed');
        const buf = await resp.arrayBuffer();
        const rawData = new Uint8Array(buf);
        const atlas = await parseAtlas(atlasText, ch);
        const parser = new PIXI.spine.SpineParser();
        const bp = parser.createBinaryParser();
        bp.scale = 1;
        const data = bp.readSkeletonData(atlas, rawData);
        spineCache[ch.id] = data;
        return data;
    }

    const atlas = await parseAtlas(atlasText, ch);
    const parser = new PIXI.spine.SpineParser();
    const jp = parser.createJsonParser();
    jp.scale = 1;
    const data = jp.readSkeletonData(atlas, jsonData);
    spineCache[ch.id] = data;
    return data;
}

// ============ PRELOAD WITH PROGRESS ============
async function preloadAll() {
    let loaded = 0, failed = 0;
    for (const ch of CHARS) {
        ovText.textContent = `Loading ${ch.name}... (${loaded+1}/${CHARS.length})`;
        try {
            await loadCharacter(ch);
        } catch(e) {
            console.warn('Failed to load', ch.id, e.message);
            failed++;
        }
        loaded++;
    }
    // Need at least heroes loaded
    const heroesReady = HERO_IDS.every(i => !!spineCache[CHARS[i].id]);
    if (!heroesReady) {
        ovText.textContent = 'Error: Could not load hero characters. Check console.';
        return false;
    }
    ovText.textContent = failed > 0 ? `Ready! (${failed} char(s) failed to load)` : 'All characters loaded!';
    return true;
}

// ============ BATTLE LOG ============
function log(msg, cls) {
    const d = document.createElement('div');
    d.className = cls || '';
    d.textContent = msg;
    logEl.appendChild(d);
    logEl.scrollTop = logEl.scrollHeight;
    while (logEl.children.length > 40) logEl.removeChild(logEl.firstChild);
}

// ============ FIND ANIMATION ============
function findAnim(anims, type) {
    const patterns = {
        idle: [/idle/i, /wait/i, /stand/i, /normal/i],
        walk: [/walk/i, /run/i, /move/i],
        attack: [/skill.?01/i, /attack/i, /skill/i, /atk/i],
        die: [/die/i, /dead/i, /death/i, /defeat/i]
    };
    const pats = patterns[type] || [];
    for (const p of pats) {
        const found = anims.find(a => p.test(a));
        if (found) return found;
    }
    if (type === 'idle') return anims[0];
    if (type === 'attack') return anims[1] || anims[0];
    return null;
}

// ============ CREATE UNIT ============
function createUnit(charIdx, side, x, y) {
    const def = CHARS[charIdx];
    const spineData = spineCache[def.id];
    if (!spineData) return null;

    const spine = new PIXI.spine.Spine(spineData);
    const scale = 0.12;
    spine.scale.set(side === 'enemy' ? -scale : scale, scale);
    spine.x = x;
    spine.y = y;
    app.stage.addChild(spine);

    const anims = spineData.animations.map(a => a.name);
    const idleAnim = findAnim(anims, 'idle');
    const walkAnim = findAnim(anims, 'walk') || idleAnim;
    const atkAnim = findAnim(anims, 'attack') || idleAnim;
    const dieAnim = findAnim(anims, 'die');

    if (idleAnim) try { spine.state.setAnimation(0, idleAnim, true); } catch(e){}

    // HP bar
    const hpBg = new PIXI.Graphics();
    const hpFill = new PIXI.Graphics();
    app.stage.addChild(hpBg);
    app.stage.addChild(hpFill);

    // Name label
    const label = new PIXI.Text(def.name, { fontSize:9, fill: side==='hero'?0x4ecdc4:0xe94560, fontFamily:'Segoe UI' });
    label.anchor.set(0.5, 1);
    app.stage.addChild(label);

    const baseHp = side === 'hero' ? 800 : 600;
    const unit = {
        spine, side, def, charIdx, anims,
        animNames: { idle:idleAnim, walk:walkAnim, attack:atkAnim, die:dieAnim },
        hp: baseHp, maxHp: baseHp,
        atk: 60 + Math.floor(Math.random()*30),
        atkSpeed: 1.5 + Math.random()*0.5,
        range: 80, moveSpeed: 80 + Math.random()*40,
        x, y, atkTimer: Math.random()*0.5,
        alive: true, state: 'idle', dyingTimer: 0,
        hpBg, hpFill, label
    };
    drawHp(unit);
    return unit;
}

function drawHp(u) {
    const bw = 44, bh = 5;
    const bx = u.x - bw/2, by = u.y - 75;
    u.hpBg.clear();
    u.hpFill.clear();
    if (!u.alive && u.dyingTimer <= 0) { u.label.visible = false; return; }
    u.hpBg.beginFill(0x222222).drawRoundedRect(bx, by, bw, bh, 2).endFill();
    const ratio = Math.max(0, u.hp / u.maxHp);
    const color = ratio > 0.5 ? 0x44dd44 : ratio > 0.25 ? 0xddaa00 : 0xdd3333;
    u.hpFill.beginFill(color).drawRoundedRect(bx+1, by+1, (bw-2)*ratio, bh-2, 1).endFill();
    u.label.x = u.x;
    u.label.y = by - 2;
}

// ============ SET ANIM STATE ============
function setUnitState(u, state) {
    if (u.state === state) return;
    u.state = state;
    const animName = u.animNames[state] || u.animNames.idle;
    if (!animName) return;
    try {
        const loop = (state !== 'attack' && state !== 'die');
        u.spine.state.setAnimation(0, animName, loop);
        if (state === 'attack') {
            u.spine.state.addAnimation(0, u.animNames.idle, true, 0);
        }
    } catch(e) {}
}

// ============ BATTLE UPDATE ============
function getTarget(unit) {
    let closest = null, minD = Infinity;
    for (const u of units) {
        if (!u.alive || u.side === unit.side) continue;
        const d = Math.abs(u.x - unit.x);
        if (d < minD) { minD = d; closest = u; }
    }
    return closest;
}

function updateUnit(u, dt) {
    if (!u.alive) {
        if (u.dyingTimer > 0) {
            u.dyingTimer -= dt;
            if (u.dyingTimer <= 0) {
                u.spine.alpha = 0.2;
                u.hpBg.visible = false;
                u.hpFill.visible = false;
                u.label.visible = false;
            }
        }
        return;
    }
    u.atkTimer -= dt;
    const target = getTarget(u);
    if (!target) { setUnitState(u, 'idle'); return; }

    const dist = Math.abs(target.x - u.x);
    if (dist > u.range) {
        // Move
        const dir = target.x > u.x ? 1 : -1;
        u.x += dir * u.moveSpeed * dt;
        u.spine.x = u.x;
        setUnitState(u, 'walk');
        drawHp(u);
    } else {
        // In range
        if (u.atkTimer <= 0) {
            u.atkTimer = u.atkSpeed;
            setUnitState(u, 'attack');
            // Damage
            const dmg = Math.round(u.atk * (0.85 + Math.random()*0.3));
            target.hp -= dmg;
            log(`${u.def.name} → ${target.def.name} -${dmg}`, 'ldmg');
            if (target.hp <= 0) {
                target.hp = 0;
                target.alive = false;
                target.dyingTimer = 1.2;
                setUnitState(target, 'die');
                log(`${target.def.name} defeated!`, 'lkill');
            }
            drawHp(target);
        } else {
            if (u.state !== 'attack') setUnitState(u, 'idle');
        }
    }
}

// ============ GAME LOOP ============
let lastTime = 0;
function gameLoop(time) {
    if (!battleRunning) return;
    const rawDt = Math.min((time - lastTime) / 1000, 0.1);
    lastTime = time;
    const dt = rawDt * gameSpeed;

    for (const u of units) updateUnit(u, dt);

    // Check end condition
    const heroesAlive = units.filter(u => u.side==='hero' && u.alive).length;
    const enemiesAlive = units.filter(u => u.side==='enemy' && u.alive).length;
    if (enemiesAlive === 0) { endBattle(true); return; }
    if (heroesAlive === 0) { endBattle(false); return; }

    requestAnimationFrame(gameLoop);
}

// ============ STAGE SETUP ============
function clearUnits() {
    for (const u of units) {
        if (u.spine.parent) app.stage.removeChild(u.spine);
        if (u.hpBg.parent) app.stage.removeChild(u.hpBg);
        if (u.hpFill.parent) app.stage.removeChild(u.hpFill);
        if (u.label.parent) app.stage.removeChild(u.label);
    }
    units = [];
}

function startStage(idx) {
    currentStage = idx;
    clearUnits();
    logEl.innerHTML = '';
    const stage = STAGES[idx];

    const cw = app.renderer.width / (window.devicePixelRatio||1);
    const ch = app.renderer.height / (window.devicePixelRatio||1);
    const groundY = ch * 0.78;

    stageTitle.textContent = `Stage ${idx+1} / 5` + (stage.boss ? ' (BOSS)' : '');
    log(`=== STAGE ${idx+1} ===`, 'lstage');

    // Heroes (left)
    for (let i = 0; i < HERO_IDS.length; i++) {
        const x = cw * 0.12 + i * 55;
        const y = groundY + (i-1) * 20;
        const u = createUnit(HERO_IDS[i], 'hero', x, y);
        if (u) units.push(u);
    }

    // Enemies (right)
    let enemyIndices = [];
    if (stage.boss) {
        enemyIndices = [0,1,2,3,4,5,6];
    } else {
        for (let i = 0; i < stage.enemyCount; i++) {
            enemyIndices.push(ENEMY_POOL[Math.floor(Math.random()*ENEMY_POOL.length)]);
        }
    }

    for (let i = 0; i < enemyIndices.length; i++) {
        const col = Math.floor(i / 3);
        const row = i % 3;
        const x = cw * 0.88 - col * 55;
        const y = groundY + (row-1) * 25;
        const u = createUnit(enemyIndices[i], 'enemy', x, y);
        if (u) {
            if (stage.boss) { u.maxHp = Math.round(u.maxHp * 0.6); u.hp = u.maxHp; drawHp(u); }
            units.push(u);
        }
    }

    hudInfo.textContent = `Heroes: ${units.filter(u=>u.side==='hero').length} | Enemies: ${units.filter(u=>u.side==='enemy').length}`;

    // Start loop
    battleRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function endBattle(won) {
    battleRunning = false;
    log(won ? 'VICTORY!' : 'DEFEATED...', 'lstage');

    setTimeout(() => {
        ovEl.classList.remove('hidden');
        if (won && currentStage < STAGES.length - 1) {
            ovTitle.textContent = '🏆 Stage Clear!';
            ovText.textContent = `Stage ${currentStage+1} cleared!`;
            ovBtn.textContent = 'NEXT STAGE';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(currentStage+1); };
        } else if (won) {
            ovTitle.textContent = '🎉 ALL CLEAR!';
            ovText.textContent = 'You defeated all 5 stages! Congratulations!';
            ovBtn.textContent = 'PLAY AGAIN';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(0); };
        } else {
            ovTitle.textContent = '💀 Defeated';
            ovText.textContent = `Fell at Stage ${currentStage+1}. Try again!`;
            ovBtn.textContent = 'RETRY';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(currentStage); };
        }
    }, 1200);
}

// ============ SPEED BUTTONS ============
document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        gameSpeed = parseInt(btn.dataset.speed);
    });
});

// ============ BOOT ============
initPixi();

ovBtn.style.display = 'none';
preloadAll().then(ok => {
    if (ok) {
        ovTitle.textContent = '⚔️ Auto Battle';
        ovText.textContent = '3 Heroes vs Enemies — 5 Stages';
        ovBtn.textContent = 'START BATTLE';
        ovBtn.style.display = '';
        ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(0); };
    }
});

})();
</script>
</body>
</html>
