<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Battle</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background:#000; color:#eee; font-family:'Segoe UI',sans-serif; overflow:hidden; height:100vh; }
        #hud { position:absolute; top:0; left:0; right:0; z-index:5; display:flex; justify-content:space-between; align-items:center; padding:8px 14px; pointer-events:none; }
        #stageTitle { font-size:0.85rem; color:#fff; font-weight:bold; text-shadow:0 1px 4px rgba(0,0,0,0.8); }
        .speed-controls { display:flex; gap:4px; pointer-events:all; }
        .speed-btn { padding:4px 12px; background:rgba(0,0,0,0.6); color:#fff; border:1px solid rgba(255,255,255,0.3); border-radius:4px; cursor:pointer; font-size:0.7rem; }
        .speed-btn.active { background:#e94560; border-color:#e94560; }
        #canvas-wrap { width:100%; height:100vh; position:relative; }
        #overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(0,0,0,0.9); z-index:10; flex-direction:column; gap:16px; }
        #overlay h1 { font-size:1.6rem; color:#fff; }
        #overlay p { color:#aaa; font-size:0.85rem; text-align:center; }
        #overlay button { padding:12px 36px; background:#e94560; color:#fff; border:none; border-radius:8px; font-size:1rem; cursor:pointer; font-weight:bold; }
        #overlay button:hover { background:#ff6b8a; }
        #overlay.hidden { display:none; }
    </style>
</head>
<body>
<div id="canvas-wrap">
    <div id="hud">
        <span id="stageTitle">Stage 1 / 5</span>
        <div class="speed-controls">
            <button class="speed-btn active" data-speed="1">1x</button>
            <button class="speed-btn" data-speed="2">2x</button>
            <button class="speed-btn" data-speed="3">3x</button>
        </div>
    </div>
</div>
<div id="overlay">
    <h1 id="ovTitle">Auto Battle</h1>
    <p id="ovText">Loading characters...</p>
    <button id="ovBtn" style="display:none">START</button>
</div>

<script src="pixi.min.js"></script>
<script src="pixi-spine.js"></script>
<script src="spine36-skel2json.js"></script>
<script>
(function(){
'use strict';

// ============ CHARACTER DEFINITIONS ============
// type: 'melee' = walk up close, 'ranged' = attack from distance
const CHARS = [
    { id:'char001', name:'Mage', dataFile:'assets/char001/cream_arcade_000.json', atlasFile:'assets/char001/cream_arcade_000.atlas', format:'json36', type:'ranged' },
    { id:'char002', name:'Swordsman', dataFile:'assets/char002/H30056.skel', atlasFile:'assets/char002/H30056.atlas', format:'skel38', type:'melee' },
    { id:'char003', name:'Warrior', dataFile:'assets/char003/L05001.skel', atlasFile:'assets/char003/L05001.atlas', format:'skel36', type:'melee' },
    { id:'char004', name:'Gunner', dataFile:'assets/char004/H30103.skel', atlasFile:'assets/char004/H30103.atlas', format:'skel38', type:'ranged' },
    { id:'char005', name:'Fighter', dataFile:'assets/char005/crew110016.skel', atlasFile:'assets/char005/crew110016.atlas', format:'skel36', type:'melee' },
    { id:'char006', name:'Archer', dataFile:'assets/char006/crew110026.skel', atlasFile:'assets/char006/crew110026.atlas', format:'skel36', type:'ranged' },
    { id:'char007', name:'Assassin', dataFile:'assets/char007/crew130004.skel', atlasFile:'assets/char007/crew130004.atlas', format:'skel36', type:'melee' }
];

const HERO_IDS = [0,1,2];
const ENEMY_POOL = [3,4,5,6];
const STAGES = [
    { enemyCount:1 },
    { enemyCount:2 },
    { enemyCount:3 },
    { enemyCount:4 },
    { enemyCount:7, boss:true }
];

// ============ GLOBALS ============
let app, gameSpeed = 1, currentStage = 0, battleRunning = false;
let units = [], spineCache = {};
const MELEE_RANGE = 70;
const RANGED_RANGE = 220;
const MELEE_SPEED = 100;
const RANGED_SPEED = 40;

const wrap = document.getElementById('canvas-wrap');
const ovEl = document.getElementById('overlay');
const ovTitle = document.getElementById('ovTitle');
const ovText = document.getElementById('ovText');
const ovBtn = document.getElementById('ovBtn');
const stageTitle = document.getElementById('stageTitle');

// ============ INIT PIXI ============
function initPixi() {
    app = new PIXI.Application({
        width: wrap.clientWidth,
        height: wrap.clientHeight,
        backgroundColor: 0x1a1a2e,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    wrap.insertBefore(app.view, wrap.firstChild);
    window.addEventListener('resize', () => {
        app.renderer.resize(wrap.clientWidth, wrap.clientHeight);
    });
}

// ============ SPINE LOADING ============
function parseAtlas(atlasText, ch) {
    return new Promise((resolve, reject) => {
        const basePath = ch.atlasFile.substring(0, ch.atlasFile.lastIndexOf('/') + 1);
        let timeout = setTimeout(() => reject(new Error('Atlas timeout: ' + ch.id)), 15000);
        new PIXI.spine.TextureAtlas(atlasText, (pageName, callback) => {
            const tex = PIXI.BaseTexture.from(basePath + pageName, { scaleMode: PIXI.SCALE_MODES.LINEAR });
            if (tex.valid) callback(tex);
            else { tex.once('loaded', () => callback(tex)); tex.once('error', () => reject(new Error('Tex fail'))); }
        }, (atlas) => { clearTimeout(timeout); resolve(atlas); });
    });
}

async function loadCharacter(ch) {
    if (spineCache[ch.id]) return spineCache[ch.id];
    const atlasResp = await fetch(ch.atlasFile);
    if (!atlasResp.ok) throw new Error('Atlas fail');
    let atlasText = (await atlasResp.text()).split('\n').map(l=>l.trimEnd()).join('\n');

    let jsonData;
    if (ch.format === 'json36') {
        jsonData = await (await fetch(ch.dataFile)).json();
    } else if (ch.format === 'skel36') {
        const buf = await (await fetch(ch.dataFile)).arrayBuffer();
        jsonData = spine36SkelToJson(buf);
    } else if (ch.format === 'skel38') {
        const buf = await (await fetch(ch.dataFile)).arrayBuffer();
        const atlas = await parseAtlas(atlasText, ch);
        const bp = new PIXI.spine.SpineParser().createBinaryParser();
        bp.scale = 1;
        const data = bp.readSkeletonData(atlas, new Uint8Array(buf));
        spineCache[ch.id] = data;
        return data;
    }
    const atlas = await parseAtlas(atlasText, ch);
    const jp = new PIXI.spine.SpineParser().createJsonParser();
    jp.scale = 1;
    const data = jp.readSkeletonData(atlas, jsonData);
    spineCache[ch.id] = data;
    return data;
}

async function preloadAll() {
    let loaded = 0, failed = 0;
    for (const ch of CHARS) {
        ovText.textContent = `Loading ${ch.name}... (${loaded+1}/${CHARS.length})`;
        try { await loadCharacter(ch); } catch(e) { console.warn('Failed:', ch.id, e.message); failed++; }
        loaded++;
    }
    if (!HERO_IDS.every(i => !!spineCache[CHARS[i].id])) {
        ovText.textContent = 'Error loading heroes.';
        return false;
    }
    ovText.textContent = failed > 0 ? `Ready (${failed} failed)` : 'Ready!';
    return true;
}

// ============ FIND ANIMATION ============
function findAnim(anims, type) {
    const p = { idle:[/idle/i,/wait/i,/stand/i,/normal/i], walk:[/walk/i,/run/i,/move/i], attack:[/skill.?01/i,/attack/i,/skill/i,/atk/i], die:[/die/i,/dead/i,/death/i] };
    for (const re of (p[type]||[])) { const f = anims.find(a=>re.test(a)); if (f) return f; }
    if (type==='idle') return anims[0];
    if (type==='attack') return anims[1]||anims[0];
    return null;
}

// ============ CREATE UNIT ============
const TARGET_HEIGHT = 90; // normalize all chars to this pixel height

function createUnit(charIdx, side, x, y) {
    const def = CHARS[charIdx];
    const spineData = spineCache[def.id];
    if (!spineData) return null;

    const spine = new PIXI.spine.Spine(spineData);
    // Normalize: compute bounds then scale to TARGET_HEIGHT
    spine.skeleton.updateWorldTransform();
    spine.update(0);
    let bh = 600;
    try {
        const bounds = spine.getLocalBounds();
        if (bounds.height > 0 && isFinite(bounds.height)) bh = bounds.height;
    } catch(e) {}
    const scale = TARGET_HEIGHT / bh;
    // All chars face LEFT by default. Heroes flip to face RIGHT.
    spine.scale.set(side==='hero' ? -scale : scale, scale);
    spine.x = x;
    spine.y = y;
    app.stage.addChild(spine);

    const anims = spineData.animations.map(a=>a.name);
    const idleAnim = findAnim(anims,'idle');
    const walkAnim = findAnim(anims,'walk') || idleAnim;
    const atkAnim = findAnim(anims,'attack') || idleAnim;
    const dieAnim = findAnim(anims,'die');

    if (idleAnim) try { spine.state.setAnimation(0, idleAnim, true); } catch(e){}

    // HP bar container
    const hpContainer = new PIXI.Container();
    app.stage.addChild(hpContainer);

    const isRanged = def.type === 'ranged';
    const baseHp = side==='hero' ? 900 : 700;

    const unit = {
        spine, side, def, charIdx,
        animNames: { idle:idleAnim, walk:walkAnim, attack:atkAnim, die:dieAnim },
        hp: baseHp, maxHp: baseHp,
        atk: isRanged ? 55 + Math.floor(Math.random()*15) : 70 + Math.floor(Math.random()*20),
        atkSpeed: isRanged ? 1.8 : 1.3,
        range: isRanged ? RANGED_RANGE : MELEE_RANGE,
        moveSpeed: isRanged ? RANGED_SPEED : MELEE_SPEED,
        isRanged,
        x, y, atkTimer: Math.random()*0.8,
        alive: true, state: 'idle', dyingTimer: 0,
        hpContainer
    };
    drawHp(unit);
    return unit;
}

function drawHp(u) {
    const c = u.hpContainer;
    c.removeChildren();
    if (!u.alive && u.dyingTimer <= 0) { c.visible = false; return; }
    c.visible = true;

    const bw = 52, bh = 7;
    const bg = new PIXI.Graphics();
    bg.beginFill(0x000000, 0.6).drawRoundedRect(-bw/2-1, -1, bw+2, bh+2, 3).endFill();
    c.addChild(bg);

    const ratio = Math.max(0, u.hp / u.maxHp);
    const fill = new PIXI.Graphics();
    const color = u.side==='hero' ? 0x22cc55 : 0xcc2222;
    fill.beginFill(color).drawRoundedRect(-bw/2, 0, bw*ratio, bh, 2).endFill();
    c.addChild(fill);

    // Name
    const label = new PIXI.Text(u.def.name, { fontSize:10, fill:0xffffff, fontFamily:'Segoe UI', fontWeight:'bold' });
    label.anchor.set(0.5, 1);
    label.y = -4;
    c.addChild(label);

    c.x = u.x;
    c.y = u.y - 85;
}

// ============ ANIM STATE ============
function setUnitState(u, state) {
    if (u.state === state) return;
    u.state = state;
    const animName = u.animNames[state] || u.animNames.idle;
    if (!animName) return;
    try {
        const loop = (state !== 'attack' && state !== 'die');
        u.spine.state.setAnimation(0, animName, loop);
        if (state === 'attack') u.spine.state.addAnimation(0, u.animNames.idle, true, 0);
    } catch(e) {}
}

// ============ BATTLE LOGIC ============
function getTarget(unit) {
    let closest = null, minD = Infinity;
    for (const u of units) {
        if (!u.alive || u.side === unit.side) continue;
        const d = Math.abs(u.x - unit.x);
        if (d < minD) { minD = d; closest = u; }
    }
    return closest;
}

function updateUnit(u, dt) {
    if (!u.alive) {
        if (u.dyingTimer > 0) {
            u.dyingTimer -= dt;
            if (u.dyingTimer <= 0) { u.spine.alpha = 0.15; u.hpContainer.visible = false; }
        }
        return;
    }
    u.atkTimer -= dt;
    const target = getTarget(u);
    if (!target) { setUnitState(u, 'idle'); return; }

    const dist = Math.abs(target.x - u.x);

    if (dist > u.range) {
        // Move toward target
        const dir = target.x > u.x ? 1 : -1;
        u.x += dir * u.moveSpeed * dt;
        u.spine.x = u.x;
        u.hpContainer.x = u.x;
        setUnitState(u, 'walk');
    } else {
        // In range - attack
        if (u.atkTimer <= 0) {
            u.atkTimer = u.atkSpeed;
            setUnitState(u, 'attack');
            const dmg = Math.round(u.atk * (0.85 + Math.random()*0.3));
            target.hp -= dmg;
            if (target.hp <= 0) {
                target.hp = 0;
                target.alive = false;
                target.dyingTimer = 1.0;
                setUnitState(target, 'die');
            }
            drawHp(target);
        } else {
            if (u.state !== 'attack') setUnitState(u, 'idle');
        }
    }
}

// ============ GAME LOOP ============
let lastTime = 0;
function gameLoop(time) {
    if (!battleRunning) return;
    const dt = Math.min((time - lastTime) / 1000, 0.1) * gameSpeed;
    lastTime = time;
    for (const u of units) updateUnit(u, dt);

    const heroesAlive = units.filter(u=>u.side==='hero'&&u.alive).length;
    const enemiesAlive = units.filter(u=>u.side==='enemy'&&u.alive).length;
    if (enemiesAlive === 0) { endBattle(true); return; }
    if (heroesAlive === 0) { endBattle(false); return; }
    requestAnimationFrame(gameLoop);
}

// ============ STAGE SETUP ============
function clearUnits() {
    for (const u of units) {
        if (u.spine.parent) app.stage.removeChild(u.spine);
        if (u.hpContainer.parent) app.stage.removeChild(u.hpContainer);
    }
    units = [];
}

function startStage(idx) {
    currentStage = idx;
    clearUnits();
    const stage = STAGES[idx];
    const cw = app.renderer.width / (window.devicePixelRatio||1);
    const ch = app.renderer.height / (window.devicePixelRatio||1);
    const groundY = ch * 0.72;

    stageTitle.textContent = `Stage ${idx+1} / 5` + (stage.boss ? ' BOSS' : '');

    // Heroes (left side) - formation: back row ranged, front row melee
    const heroPositions = [
        { x: cw*0.18, y: groundY },
        { x: cw*0.10, y: groundY - 30 },
        { x: cw*0.10, y: groundY + 30 }
    ];
    for (let i = 0; i < HERO_IDS.length; i++) {
        const pos = heroPositions[i];
        const u = createUnit(HERO_IDS[i], 'hero', pos.x, pos.y);
        if (u) units.push(u);
    }

    // Enemies (right side)
    let enemyIndices = [];
    if (stage.boss) {
        enemyIndices = [0,1,2,3,4,5,6];
    } else {
        for (let i = 0; i < stage.enemyCount; i++) {
            enemyIndices.push(ENEMY_POOL[Math.floor(Math.random()*ENEMY_POOL.length)]);
        }
    }

    const cols = Math.ceil(enemyIndices.length / 3);
    for (let i = 0; i < enemyIndices.length; i++) {
        const col = Math.floor(i / 3);
        const row = i % 3;
        const rowCount = Math.min(3, enemyIndices.length - col*3);
        const rowOffset = (rowCount - 1) * 25;
        const x = cw*0.82 + col*60;
        const y = groundY - rowOffset/2 + row*50;
        const u = createUnit(enemyIndices[i], 'enemy', x, y);
        if (u) {
            if (stage.boss) { u.maxHp = Math.round(u.maxHp*0.5); u.hp = u.maxHp; drawHp(u); }
            units.push(u);
        }
    }

    battleRunning = true;
    lastTime = performance.now();
    requestAnimationFrame(gameLoop);
}

function endBattle(won) {
    battleRunning = false;
    setTimeout(() => {
        ovEl.classList.remove('hidden');
        if (won && currentStage < STAGES.length - 1) {
            ovTitle.textContent = 'Victory!';
            ovText.textContent = `Stage ${currentStage+1} cleared`;
            ovBtn.textContent = 'NEXT STAGE';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(currentStage+1); };
        } else if (won) {
            ovTitle.textContent = 'All Stages Cleared!';
            ovText.textContent = 'Congratulations!';
            ovBtn.textContent = 'PLAY AGAIN';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(0); };
        } else {
            ovTitle.textContent = 'Defeated';
            ovText.textContent = `Stage ${currentStage+1}`;
            ovBtn.textContent = 'RETRY';
            ovBtn.style.display = '';
            ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(currentStage); };
        }
    }, 1000);
}

// ============ SPEED BUTTONS ============
document.querySelectorAll('.speed-btn').forEach(btn => {
    btn.addEventListener('click', () => {
        document.querySelectorAll('.speed-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        gameSpeed = parseInt(btn.dataset.speed);
    });
});

// ============ BOOT ============
initPixi();
preloadAll().then(ok => {
    if (ok) {
        ovTitle.textContent = 'Auto Battle';
        ovText.textContent = '3 Heroes vs Enemies';
        ovBtn.textContent = 'START';
        ovBtn.style.display = '';
        ovBtn.onclick = () => { ovEl.classList.add('hidden'); startStage(0); };
    }
});

})();
</script>
</body>
</html>
