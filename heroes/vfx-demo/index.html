<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VFX Blue Meteor - Spine Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0a0e27, #1a1a3e);
    color: #fff;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { color: #4ec9ff; margin-bottom: 4px; }
  .subtitle { color: #8a9bb8; margin-bottom: 20px; font-size: 0.9rem; }
  #stage {
    width: 90vw;
    max-width: 900px;
    height: 60vh;
    background: radial-gradient(ellipse at center, #1a2540, #050810);
    border: 1px solid #2a3a5c;
    border-radius: 12px;
    box-shadow: 0 0 40px rgba(78, 201, 255, 0.2);
    position: relative;
    overflow: hidden;
  }
  #stage canvas { width: 100%; height: 100%; display: block; }
  .controls {
    margin-top: 20px;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 10px 20px;
    background: #1e3a5f;
    color: #fff;
    border: 1px solid #4ec9ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.9rem;
    transition: all 0.2s;
  }
  button:hover, button.active {
    background: #4ec9ff;
    color: #0a0e27;
    box-shadow: 0 0 15px rgba(78, 201, 255, 0.5);
  }
  #event-log {
    margin-top: 16px;
    padding: 12px;
    background: rgba(0,0,0,0.4);
    border-radius: 8px;
    width: 90vw;
    max-width: 900px;
    height: 100px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 0.8rem;
  }
  .evt { color: #4ec9ff; }
  .evt-time { color: #888; }
  #status {
    margin: 20px;
    padding: 16px 24px;
    background: rgba(255,100,100,0.1);
    border: 1px solid #ff6464;
    border-radius: 8px;
    color: #ff8888;
    display: none;
    max-width: 600px;
  }
  #status.info {
    background: rgba(78, 201, 255, 0.1);
    border-color: #4ec9ff;
    color: #4ec9ff;
  }
</style>
</head>
<body>

<h1>⚡ VFX Blue Meteor</h1>
<div class="subtitle">Spine 3.8 Animation Demo</div>

<div id="status"></div>

<div id="stage"></div>

<div class="controls">
  <button id="btn-play" class="active">▶ Play "cast"</button>
  <button id="btn-replay">🔄 Replay</button>
  <button id="btn-slow">🐢 0.5x</button>
  <button id="btn-normal">▶ 1x</button>
  <button id="btn-fast">⚡ 2x</button>
</div>

<div id="event-log"></div>

<script src="../pixi.min.js"></script>
<script src="../pixi-spine.js"></script>

<script>
(async function() {
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const log = document.getElementById('event-log');

  function showStatus(msg, isInfo) {
    status.textContent = msg;
    status.className = isInfo ? 'info' : '';
    status.style.display = 'block';
  }

  function logEvent(time, name) {
    const div = document.createElement('div');
    div.innerHTML = `<span class="evt-time">[${time.toFixed(2)}s]</span> <span class="evt">📢 ${name}</span>`;
    log.insertBefore(div, log.firstChild);
    if (log.children.length > 30) log.removeChild(log.lastChild);
  }

  // Check if PNG exists first
  try {
    const test = await fetch('vfx_blue_meteor.png', { method: 'HEAD' });
    if (!test.ok) throw new Error();
  } catch (e) {
    showStatus('⚠️ File "vfx_blue_meteor.png" belum ada di folder vfx-demo/. Silakan save gambar sprite sheet VFX biru Anda dengan nama tersebut ke folder ini.');
    return;
  }

  const app = new PIXI.Application({
    width: stage.clientWidth,
    height: stage.clientHeight,
    backgroundAlpha: 0,
    antialias: true,
    resolution: window.devicePixelRatio || 1,
    autoDensity: true
  });
  stage.appendChild(app.view);

  // Load spine assets
  PIXI.Loader.shared.add('vfx', 'vfx_blue_meteor.json').load((loader, resources) => {
    if (!resources.vfx || !resources.vfx.spineData) {
      showStatus('Gagal load Spine data. Cek console.');
      console.error(resources);
      return;
    }

    const spine = new PIXI.spine.Spine(resources.vfx.spineData);
    spine.x = stage.clientWidth / 2;
    spine.y = stage.clientHeight / 2;
    spine.scale.set(0.6);
    app.stage.addChild(spine);

    // Listen to events
    spine.state.addListener({
      event: (entry, event) => logEvent(event.time, event.data.name),
      complete: (entry) => logEvent(entry.trackTime, '✅ animation complete')
    });

    function play() {
      spine.state.setAnimation(0, 'cast', false);
      log.innerHTML = '';
    }

    play();

    // Controls
    document.getElementById('btn-play').onclick = play;
    document.getElementById('btn-replay').onclick = play;
    document.getElementById('btn-slow').onclick = () => { spine.state.timeScale = 0.5; setActive('btn-slow'); };
    document.getElementById('btn-normal').onclick = () => { spine.state.timeScale = 1.0; setActive('btn-normal'); };
    document.getElementById('btn-fast').onclick = () => { spine.state.timeScale = 2.0; setActive('btn-fast'); };

    function setActive(id) {
      ['btn-slow','btn-normal','btn-fast'].forEach(i =>
        document.getElementById(i).classList.toggle('active', i === id));
    }

    // Resize
    window.addEventListener('resize', () => {
      app.renderer.resize(stage.clientWidth, stage.clientHeight);
      spine.x = stage.clientWidth / 2;
      spine.y = stage.clientHeight / 2;
    });
  });
})();
</script>

</body>
</html>
