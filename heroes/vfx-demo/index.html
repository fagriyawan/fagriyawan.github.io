<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VFX Blue Meteor - Spine Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: linear-gradient(135deg, #0a0e27, #1a1a3e);
    color: #fff;
    font-family: system-ui, sans-serif;
    min-height: 100vh;
    padding: 16px;
  }
  h1 { color: #4ec9ff; text-align:center; }
  .subtitle { color: #8a9bb8; text-align:center; margin-bottom: 16px; font-size: 0.85rem; }
  #stage {
    width: 100%;
    max-width: 900px;
    height: 60vh;
    margin: 0 auto;
    background: radial-gradient(ellipse at center, #1a2540, #050810);
    border: 1px solid #2a3a5c;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  #stage canvas { display: block; }
  .controls {
    margin: 16px auto;
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }
  button {
    padding: 8px 16px;
    background: #1e3a5f;
    color: #fff;
    border: 1px solid #4ec9ff;
    border-radius: 6px;
    cursor: pointer;
    font-size: 0.85rem;
  }
  button:hover, button.active {
    background: #4ec9ff;
    color: #0a0e27;
  }
  #log-box {
    margin: 12px auto;
    padding: 10px;
    background: rgba(0,0,0,0.5);
    border-radius: 6px;
    width: 100%;
    max-width: 900px;
    height: 180px;
    overflow-y: auto;
    font-family: monospace;
    font-size: 0.72rem;
    border: 1px solid #2a3a5c;
  }
  .log-info { color: #4ec9ff; }
  .log-ok { color: #5fd66e; }
  .log-err { color: #ff7070; font-weight: bold; }
  .log-evt { color: #ffce5f; }
  .log-time { color: #666; margin-right: 6px; }
</style>
</head>
<body>

<h1>⚡ VFX Blue Meteor</h1>
<div class="subtitle">Spine 3.8 Animation Demo</div>

<div id="stage"></div>

<div class="controls">
  <button id="btn-replay">🔄 Replay "cast"</button>
  <button class="speed-btn" data-speed="0.5">🐢 0.5x</button>
  <button class="speed-btn active" data-speed="1">▶ 1x</button>
  <button class="speed-btn" data-speed="2">⚡ 2x</button>
</div>

<div id="log-box"></div>

<script src="../pixi.min.js"></script>
<script src="../pixi-spine.js"></script>

<script>
(async function(){
'use strict';

const stage = document.getElementById('stage');
const logBox = document.getElementById('log-box');

function log(msg, cls){
  const div = document.createElement('div');
  div.className = cls || 'log-info';
  const t = new Date().toISOString().substr(14,8);
  div.innerHTML = '<span class="log-time">'+t+'</span>' + msg;
  logBox.insertBefore(div, logBox.firstChild);
}

log('🚀 Starting demo...', 'log-info');
log('PIXI version: ' + (PIXI.VERSION || 'unknown'), 'log-info');
log('pixi-spine: ' + (PIXI.spine ? 'loaded' : 'NOT LOADED'), PIXI.spine ? 'log-ok' : 'log-err');

// === Step 1: Check files exist ===
const baseUrl = location.href.substring(0, location.href.lastIndexOf('/')+1);
log('Base URL: ' + baseUrl, 'log-info');

async function checkFile(name){
  try {
    const res = await fetch(name);
    if (!res.ok) throw new Error('HTTP '+res.status);
    log('✓ Found: ' + name + ' ('+res.headers.get('content-type')+')', 'log-ok');
    return res;
  } catch(e) {
    log('✗ MISSING: ' + name + ' — ' + e.message, 'log-err');
    return null;
  }
}

const jsonRes = await checkFile('vfx_blue_meteor.json');
const atlasRes = await checkFile('vfx_blue_meteor.atlas');
const pngRes   = await checkFile('vfx_blue_meteor.png');

if (!jsonRes || !atlasRes || !pngRes) {
  log('💥 Cannot continue: missing required files. Upload vfx_blue_meteor.png to this folder.', 'log-err');
  return;
}

// === Step 2: Parse atlas with custom texture loader ===
let atlasText, jsonData;
try {
  atlasText = await atlasRes.text();
  jsonData = await jsonRes.json();
  log('✓ Atlas size declared: ' + atlasText.split('\n')[1], 'log-ok');
  log('✓ JSON loaded: ' + Object.keys(jsonData.animations||{}).length + ' animations', 'log-ok');
} catch(e) {
  log('💥 Parse error: ' + e.message, 'log-err');
  return;
}

// === Step 3: Load atlas texture manually ===
let atlas;
try {
  atlas = await new Promise((resolve, reject) => {
    new PIXI.spine.TextureAtlas(atlasText, (pageName, callback) => {
      log('  Loading texture page: ' + pageName, 'log-info');
      const tex = PIXI.BaseTexture.from('vfx_blue_meteor.png', { scaleMode: PIXI.SCALE_MODES.LINEAR });
      if (tex.valid) {
        log('  ✓ Texture ready immediately', 'log-ok');
        callback(tex);
      } else {
        tex.once('loaded', () => { log('  ✓ Texture loaded', 'log-ok'); callback(tex); });
        tex.once('error', (e) => reject(new Error('Texture load failed: '+pageName)));
      }
    }, (a) => resolve(a));
  });
  log('✓ Atlas parsed: ' + atlas.regions.length + ' regions', 'log-ok');
} catch(e) {
  log('💥 Atlas error: ' + e.message, 'log-err');
  return;
}

// === Step 4: Parse skeleton data ===
let skeletonData;
try {
  const parser = new PIXI.spine.SpineParser();
  const jsonParser = parser.createJsonParser();
  jsonParser.scale = 1;
  skeletonData = jsonParser.readSkeletonData(atlas, jsonData);
  log('✓ Skeleton parsed: ' + skeletonData.bones.length + ' bones, ' + skeletonData.slots.length + ' slots', 'log-ok');
} catch(e) {
  log('💥 Skeleton parse error: ' + e.message, 'log-err');
  console.error(e);
  return;
}

// === Step 5: Create PIXI app & spine ===
const app = new PIXI.Application({
  width: stage.clientWidth,
  height: stage.clientHeight,
  backgroundAlpha: 0,
  antialias: true,
  resolution: window.devicePixelRatio || 1,
  autoDensity: true
});
stage.appendChild(app.view);
log('✓ PIXI app created: ' + app.renderer.width + 'x' + app.renderer.height, 'log-ok');

const spine = new PIXI.spine.Spine(skeletonData);
spine.x = stage.clientWidth / 2;
spine.y = stage.clientHeight / 2;
spine.scale.set(0.5);
app.stage.addChild(spine);
log('✓ Spine added to stage at ('+spine.x+','+spine.y+')', 'log-ok');

// Listen events
spine.state.addListener({
  event: (entry, event) => log('📢 ' + event.data.name + ' @ ' + event.time.toFixed(2)+'s', 'log-evt'),
  complete: (entry) => log('✅ animation complete', 'log-evt')
});

function play(){
  spine.state.setAnimation(0, 'cast', false);
  log('▶ Playing animation: cast', 'log-info');
}

play();

// Controls
document.getElementById('btn-replay').onclick = play;
document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    spine.state.timeScale = parseFloat(btn.dataset.speed);
    log('Speed: ' + btn.dataset.speed + 'x', 'log-info');
  };
});

window.addEventListener('resize', () => {
  app.renderer.resize(stage.clientWidth, stage.clientHeight);
  spine.x = stage.clientWidth / 2;
  spine.y = stage.clientHeight / 2;
});

})().catch(e => {
  const logBox = document.getElementById('log-box');
  const div = document.createElement('div');
  div.className = 'log-err';
  div.textContent = '💥 FATAL: ' + e.message + ' — see browser console';
  logBox.insertBefore(div, logBox.firstChild);
  console.error(e);
});
</script>

</body>
</html>
