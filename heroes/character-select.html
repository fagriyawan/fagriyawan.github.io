<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Select - Auto Battler</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #1a1a2e;
            color: #eee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            height: 100vh;
            height: 100dvh;
        }
        #header {
            text-align: center;
            padding: 10px;
            background: linear-gradient(135deg, #16213e, #0f3460);
            border-bottom: 2px solid #e94560;
            position: relative;
        }
        #header h1 {
            font-size: 1.2rem;
            color: #e94560;
            text-shadow: 0 0 10px rgba(233,69,96,0.5);
        }
        #menu-toggle {
            display: none;
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            background: #0f3460;
            border: 1px solid #e94560;
            color: #eee;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 1rem;
            cursor: pointer;
        }
        #main { display: flex; height: calc(100vh - 50px); height: calc(100dvh - 50px); }
        #sidebar {
            width: 200px;
            background: #16213e;
            padding: 10px;
            overflow-y: auto;
            border-right: 1px solid #0f3460;
            transition: transform 0.3s ease;
            z-index: 10;
        }
        .char-btn {
            display: block; width: 100%;
            padding: 8px 10px; margin-bottom: 5px;
            background: #0f3460; color: #eee;
            border: 1px solid #1a1a2e;
            border-radius: 6px; cursor: pointer;
            font-size: 0.8rem; transition: all 0.2s;
            text-align: left;
        }
        .char-btn:hover { background: #1a4080; border-color: #e94560; }
        .char-btn.active { background: #e94560; color: #fff; }
        .char-btn .char-name { font-weight: bold; }
        .char-btn .char-info { font-size: 0.65rem; opacity: 0.7; margin-top: 2px; }
        #canvas-area {
            flex: 1; position: relative;
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            display: flex; gap: 6px; flex-wrap: nowrap;
            overflow-x: auto; overflow-y: hidden;
            padding: 10px 12px;
            background: linear-gradient(transparent, rgba(26,26,46,0.95) 30%);
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: #e94560 #16213e;
        }
        #controls::-webkit-scrollbar { height: 4px; }
        #controls::-webkit-scrollbar-track { background: #16213e; }
        #controls::-webkit-scrollbar-thumb { background: #e94560; border-radius: 2px; }
        .anim-btn {
            padding: 8px 14px; background: #0f3460;
            color: #eee; border: 1px solid #e94560;
            border-radius: 4px; cursor: pointer;
            font-size: 0.75rem; transition: all 0.2s;
            white-space: nowrap;
            flex-shrink: 0;
        }
        .anim-btn:hover, .anim-btn.active { background: #e94560; color: #fff; }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            #menu-toggle { display: block; }
            #header h1 { font-size: 1rem; }
            #main { position: relative; }
            #sidebar {
                position: absolute;
                top: 0; left: 0; bottom: 0;
                width: 180px;
                transform: translateX(-100%);
                box-shadow: 2px 0 10px rgba(0,0,0,0.5);
            }
            #sidebar.open {
                transform: translateX(0);
            }
            #canvas-area {
                width: 100%;
            }
            #controls {
                padding: 8px 10px 12px;
                gap: 5px;
            }
            .anim-btn {
                padding: 7px 12px;
                font-size: 0.7rem;
            }
            .char-btn {
                padding: 7px 8px;
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            #sidebar { width: 160px; }
            .anim-btn {
                padding: 6px 10px;
                font-size: 0.65rem;
            }
        }

        #overlay {
            display: none;
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 9;
        }
        #overlay.show { display: block; }
</style>
</head>
<body>
    <div id="header">
        <button id="menu-toggle">&#9776;</button>
        <h1>CHARACTER SELECT</h1>
    </div>
    <div id="main">
        <div id="overlay"></div>
        <div id="sidebar"></div>
        <div id="canvas-area">
            <div id="status" style="text-align:center;color:#888;">Select a character</div>
            <div id="controls"></div>
        </div>
    </div>
    <script src="pixi.min.js"></script>
    <script src="pixi-spine.js"></script>
    <script src="spine36-skel2json.js"></script>
    <script>

(function() {
'use strict';

const CHARACTERS = [
    // === Original Characters ===
    { id:'char001', name:'Cream Arcade', info:'Spine 3.6 JSON',
      dataFile:'assets/char001/cream_arcade_000.json',
      atlasFile:'assets/char001/cream_arcade_000.atlas', format:'json36' },
    { id:'char002', name:'H30056', info:'Spine 3.8 Binary',
      dataFile:'assets/char002/H30056.skel',
      atlasFile:'assets/char002/H30056.atlas', format:'skel38' },
    { id:'char003', name:'L05001', info:'Spine 3.6 Binary',
      dataFile:'assets/char003/L05001.skel',
      atlasFile:'assets/char003/L05001.atlas', format:'skel36' },
    { id:'char004', name:'H30103', info:'Spine 3.8 Binary',
      dataFile:'assets/char004/H30103.skel',
      atlasFile:'assets/char004/H30103.atlas', format:'skel38' },
    { id:'char005', name:'Crew 110016', info:'Spine 3.6 Binary',
      dataFile:'assets/char005/crew110016.skel',
      atlasFile:'assets/char005/crew110016.atlas', format:'skel36' },
    { id:'char006', name:'Crew 110026', info:'Spine 3.6 Binary',
      dataFile:'assets/char006/crew110026.skel',
      atlasFile:'assets/char006/crew110026.atlas', format:'skel36' },
    { id:'char007', name:'Crew 130004', info:'Spine 3.6 Binary',
      dataFile:'assets/char007/crew130004.skel',
      atlasFile:'assets/char007/crew130004.atlas', format:'skel36' },

    // === New Heroes (Spine 3.8 JSON) ===
    { id:'new001', name:'Hero 001', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/001/action.json',
      atlasFile:'assets/characternew/001/action.atlas', format:'json38' },
    { id:'new002', name:'Hero 002', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/002/action.json',
      atlasFile:'assets/characternew/002/action.atlas', format:'json38' },
    { id:'new003', name:'H30058', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/003/H30058.json',
      atlasFile:'assets/characternew/003/H30058.atlas', format:'json38' },
    { id:'new004', name:'H30107', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/004/H30107.json',
      atlasFile:'assets/characternew/004/H30107.atlas', format:'json38' },

    // === Monsters (Spine 3.8 JSON) ===
    { id:'monster001', name:'ZombiePon', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/monster_folder/monster_001/NPC_ZombiePon_A.json',
      atlasFile:'assets/characternew/monster_folder/monster_001/NPC_ZombiePon_A.atlas', format:'json38' },
    { id:'monster002', name:'Smoky', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/monster_folder/monster_002/Monster_Smoky_A.json',
      atlasFile:'assets/characternew/monster_folder/monster_002/Monster_Smoky_A.atlas', format:'json38' },
    { id:'monster003', name:'Nami', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/monster_folder/monster_003/Monster_Nami_A.json',
      atlasFile:'assets/characternew/monster_folder/monster_003/Monster_Nami_A.atlas', format:'json38' },
    { id:'monster004', name:'FloatingStonehead', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/monster_folder/monster_004/Monster_FloatingStonehead_A.json',
      atlasFile:'assets/characternew/monster_folder/monster_004/Monster_FloatingStonehead_A.atlas', format:'json38' },

    // === Princess Connect Re:Dive ===
    { id:'pcr001', name:'Pecorine (100301)', info:'Spine 3.6 JSON (cysp)',
      dataFile:'assets/characternew/newredrive/100311/100301_BATTLE.json',
      atlasFile:'assets/characternew/newredrive/100311/100311.atlas', format:'json36' },
    { id:'pcr002', name:'Kokkoro (100331)', info:'Spine 3.6 JSON (cysp)',
      dataFile:'assets/characternew/newredrive/100331/100301_BATTLE.json',
      atlasFile:'assets/characternew/newredrive/100331/100331.atlas', format:'json36' },
    { id:'pcr003', name:'Kyaru (100361)', info:'Spine 3.6 JSON (cysp)',
      dataFile:'assets/characternew/newredrive/100361/100301_BATTLE.json',
      atlasFile:'assets/characternew/newredrive/100361/100361.atlas', format:'json36' },

    // === Skills/Effects (Spine 3.8 JSON) ===
    { id:'skill001', name:'Skill 001', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/skill_folder/skill_001/action.json',
      atlasFile:'assets/characternew/skill_folder/skill_001/action.atlas', format:'json38' },
    { id:'skill002', name:'Skill 002', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/skill_folder/skill_002/action.json',
      atlasFile:'assets/characternew/skill_folder/skill_002/action.atlas', format:'json38' },
    { id:'skill003', name:'FX 4032', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/skill_folder/skill_003/fx_4032.json',
      atlasFile:'assets/characternew/skill_folder/skill_003/fx_4032.atlas', format:'json38' },
    { id:'skill004', name:'Orochimaru', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/skill_folder/skill_004/orochimaru01.json',
      atlasFile:'assets/characternew/skill_folder/skill_004/orochimaru01.atlas', format:'json38' },
    { id:'skill005', name:'XXM 513', info:'Spine 3.8 JSON',
      dataFile:'assets/characternew/skill_folder/skill_005/xxm_513_bs.json',
      atlasFile:'assets/characternew/skill_folder/skill_005/xxm_513_bs.atlas', format:'json38' }
];

let app = null;
let currentSpine = null;
let spineDataCache = {};

const sidebar = document.getElementById('sidebar');
const canvasArea = document.getElementById('canvas-area');
const statusEl = document.getElementById('status');
const controlsEl = document.getElementById('controls');

function initApp() {
    const w = canvasArea.clientWidth;
    const h = canvasArea.clientHeight;
    app = new PIXI.Application({
        width: w, height: h,
        backgroundColor: 0x1a1a2e,
        antialias: true,
        resolution: window.devicePixelRatio || 1,
        autoDensity: true
    });
    canvasArea.insertBefore(app.view, canvasArea.firstChild);
    window.addEventListener('resize', () => {
        app.renderer.resize(canvasArea.clientWidth, canvasArea.clientHeight);
        if (currentSpine) positionSpine(currentSpine);
    });
}

function buildSidebar() {
    let lastCategory = '';
    CHARACTERS.forEach((ch, idx) => {
        // Add category headers
        let category = '';
        if (ch.id.startsWith('char')) category = 'Original';
        else if (ch.id.startsWith('new')) category = 'New Heroes';
        else if (ch.id.startsWith('monster')) category = 'Monsters';
        else if (ch.id.startsWith('skill')) category = 'Skills/FX';

        if (category !== lastCategory) {
            const header = document.createElement('div');
            header.style.cssText = 'color:#e94560;font-size:0.7rem;font-weight:bold;padding:8px 4px 4px;text-transform:uppercase;letter-spacing:1px;border-top:1px solid #0f3460;margin-top:6px;';
            if (lastCategory === '') header.style.borderTop = 'none';
            header.textContent = category;
            sidebar.appendChild(header);
            lastCategory = category;
        }

        const btn = document.createElement('button');
        btn.className = 'char-btn';
        btn.innerHTML = '<div class="char-name">'+ch.name+'</div><div class="char-info">'+ch.info+'</div>';
        btn.onclick = () => selectCharacter(idx);
        sidebar.appendChild(btn);
    });
}


async function selectCharacter(idx) {
    closeMobileSidebar();
    sidebar.querySelectorAll('.char-btn').forEach((b,i) => b.classList.toggle('active', i===idx));
    const ch = CHARACTERS[idx];
    statusEl.style.display = 'block';
    statusEl.textContent = 'Loading ' + ch.name + '...';
    controlsEl.innerHTML = '';
    if (currentSpine) { app.stage.removeChild(currentSpine); currentSpine = null; }

    try {
        let spineData = spineDataCache[ch.id];
        if (!spineData) {
            spineData = await loadCharacter(ch);
            spineDataCache[ch.id] = spineData;
        }
        displaySpine(spineData);
        statusEl.style.display = 'none';
    } catch(e) {
        statusEl.textContent = 'Error: ' + e.message;
        statusEl.style.color = '#e94560';
        console.error('Load error for', ch.name, e);
    }
}

async function loadCharacter(ch) {
    // 1. Fetch and clean atlas text
    const atlasResp = await fetch(ch.atlasFile);
    if (!atlasResp.ok) throw new Error('Atlas fetch failed');
    let atlasText = await atlasResp.text();
    // Trim trailing spaces on each line (some atlases have them)
    atlasText = atlasText.split('\n').map(l => l.trimEnd()).join('\n');

    // 2. Get skeleton JSON data
    let jsonData;
    if (ch.format === 'json36' || ch.format === 'json38') {
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('JSON fetch failed');
        jsonData = await resp.json();
    } else if (ch.format === 'skel36') {
        // Convert binary to JSON using our converter
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('Skel fetch failed');
        const buf = await resp.arrayBuffer();
        jsonData = spine36SkelToJson(buf);
    } else if (ch.format === 'skel38') {
        // For 3.8 binary, use pixi-spine's built-in binary parser
        const resp = await fetch(ch.dataFile);
        if (!resp.ok) throw new Error('Skel fetch failed');
        const buf = await resp.arrayBuffer();
        const rawData = new Uint8Array(buf);
        // Parse atlas, then use binary parser
        const atlas = await parseAtlas(atlasText, ch);
        const parser = new PIXI.spine.SpineParser();
        const binaryParser = parser.createBinaryParser();
        binaryParser.scale = 1;
        return binaryParser.readSkeletonData(atlas, rawData);
    }

    // For JSON-based data (json36, json38, and skel36 converted to json):
    // Parse atlas, then use JSON parser
    const atlas = await parseAtlas(atlasText, ch);
    const parser = new PIXI.spine.SpineParser();
    const jsonParser = parser.createJsonParser();
    jsonParser.scale = 1;
    return jsonParser.readSkeletonData(atlas, jsonData);
}


function parseAtlas(atlasText, ch) {
    return new Promise((resolve, reject) => {
        const basePath = ch.atlasFile.substring(0, ch.atlasFile.lastIndexOf('/') + 1);
        let pendingPages = 0;
        let resolved = false;

        new PIXI.spine.TextureAtlas(atlasText, (pageName, callback) => {
            pendingPages++;
            const imgUrl = basePath + pageName;
            const tex = PIXI.BaseTexture.from(imgUrl, { scaleMode: PIXI.SCALE_MODES.LINEAR });
            if (tex.valid) {
                callback(tex);
                pendingPages--;
            } else {
                tex.once('loaded', () => { callback(tex); pendingPages--; });
                tex.once('error', () => reject(new Error('Texture failed: ' + pageName)));
            }
        }, (atlas) => {
            resolved = true;
            resolve(atlas);
        });
    });
}

function displaySpine(spineData) {
    const spineObj = new PIXI.spine.Spine(spineData);
    currentSpine = spineObj;

    // Ensure skeleton world transform is computed before positioning
    try {
        spineObj.skeleton.updateWorldTransform();
        spineObj.update(0);
    } catch(e) {
        console.warn('Initial update failed:', e.message);
    }

    app.stage.addChild(spineObj);
    positionSpine(spineObj);

    // Get animation names
    const anims = spineData.animations.map(a => a.name);
    // Play default animation
    let defaultAnim = anims.find(a => /idle|wait|stand/i.test(a)) || anims[0];
    if (defaultAnim) playAnim(spineObj, defaultAnim);
    buildAnimButtons(spineObj, anims, defaultAnim);

    // Re-position after first frame renders (fixes bounds issues)
    setTimeout(() => { if (currentSpine === spineObj) positionSpine(spineObj); }, 100);
}

function positionSpine(spineObj) {
    const cw = app.renderer.width / (window.devicePixelRatio || 1);
    const ch = app.renderer.height / (window.devicePixelRatio || 1);

    // Try to get bounds, fallback to manual sizing if skeleton not ready
    let bw = 300, bh = 500;
    try {
        spineObj.skeleton.updateWorldTransform();
        const bounds = spineObj.getLocalBounds();
        if (bounds.width > 0 && bounds.height > 0 && isFinite(bounds.width) && isFinite(bounds.height)) {
            bw = bounds.width;
            bh = bounds.height;
        }
    } catch(e) {
        console.warn('getBounds failed, using defaults:', e.message);
    }

    // Clamp to prevent too large or too small scaling
    const maxScale = 2.0;
    const minScale = 0.2;
    let scale = Math.min((cw * 0.7) / bw, (ch * 0.55) / bh, maxScale);
    scale = Math.max(scale, minScale);
    spineObj.scale.set(scale);
    spineObj.x = cw / 2;
    spineObj.y = ch * 0.55;
}

function playAnim(spineObj, animName) {
    try {
        spineObj.state.setAnimation(0, animName, true);
    } catch(e) { console.warn('Anim error:', animName, e.message); }
    controlsEl.querySelectorAll('.anim-btn').forEach(b =>
        b.classList.toggle('active', b.textContent === animName));
}

function buildAnimButtons(spineObj, anims, current) {
    controlsEl.innerHTML = '';
    anims.forEach(name => {
        const btn = document.createElement('button');
        btn.className = 'anim-btn' + (name === current ? ' active' : '');
        btn.textContent = name;
        btn.onclick = () => playAnim(spineObj, name);
        controlsEl.appendChild(btn);
    });
}

// Boot
initApp();
buildSidebar();

// Mobile menu toggle
const menuToggle = document.getElementById('menu-toggle');
const overlay = document.getElementById('overlay');
menuToggle.addEventListener('click', () => {
    sidebar.classList.toggle('open');
    overlay.classList.toggle('show');
});
overlay.addEventListener('click', () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
});
// Close sidebar on character select (mobile)
function closeMobileSidebar() {
    if (window.innerWidth <= 768) {
        sidebar.classList.remove('open');
        overlay.classList.remove('show');
    }
}

})();
    </script>
</body>
</html>
